name: OpenCodex native verification

on:
  push:
    branches: [opencodex-build]
    paths:
      - "packages/**"
      - "opencodex/**"
      - "!opencodex/BUILD-REPORT.md"
      - "!opencodex/README.md"
      - ".github/workflows/opencodex.yml"
      - ".github/actions/setup-bun/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencodex-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  OPENCODE_VERSION: 1.18.30-opencodex.2
  OPENCODE_CHANNEL: opencodex
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Compile Windows and Linux executables
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - name: Install cross-platform native dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts --os='*' --cpu='*'
          bun run --cwd packages/core fix-node-pty
      - name: Verify launcher behavior
        working-directory: packages/opencode
        run: bun test test/cli/opencodex.test.ts
      - name: Build OpenCodex with embedded UI
        run: bun run packages/opencode/script/build.ts --opencodex --skip-install --target=linux-x64,windows-x64
      - name: Transfer executables to native test hosts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OpenCodex-unverified-test-inputs
          path: packages/opencode/dist/
          if-no-files-found: error
          retention-days: 7
  native:
    name: ${{ matrix.label }} x64
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            label: Linux
            executable: opencodex
          - runner: windows-2025
            target: windows-x64
            label: Windows
            executable: opencodex.exe
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: OpenCodex-unverified-test-inputs
          path: packages/opencode/dist/
      - name: Restore Linux executable permission
        if: runner.os == 'Linux'
        run: chmod +x packages/opencode/dist/opencode-linux-x64/bin/opencodex
      - name: Install browser verification tool
        shell: bash
        run: |
          npm install --global agent-browser@0.37.1
          browser_root=$(npm root --global)
          browser_target=linux-x64
          if [ "$RUNNER_OS" = "Windows" ]; then
            browser_target=win32-x64.exe
          fi
          echo "OPENCODEX_BROWSER_BIN=$browser_root/agent-browser/bin/agent-browser-$browser_target" >> "$GITHUB_ENV"
      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: agent-browser install --with-deps
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: agent-browser install
      - name: Verify executable and browser workspace
        working-directory: packages/opencode
        run: bun run ../../opencodex/verify-runtime.ts
      - name: Stage the verified distribution
        shell: bash
        run: |
          bundle="opencodex/verification/OpenCodex-${{ matrix.label }}-x64"
          mkdir -p "$bundle"
          cp "packages/opencode/dist/opencode-${{ matrix.target }}/bin/${{ matrix.executable }}" "$bundle/"
          cp opencodex/README.md opencodex/BUILD-REPORT.md LICENSE "$bundle/"
          cp opencodex/verification/report.json "$bundle/RUNTIME-REPORT.json"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp opencodex/Start-OpenCodex.cmd "$bundle/"
          else
            cp opencodex/start-opencodex.sh "$bundle/"
            chmod +x "$bundle/opencodex" "$bundle/start-opencodex.sh"
          fi
      - name: Package Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path opencodex/verification/OpenCodex-Windows-x64 -DestinationPath opencodex/verification/OpenCodex-Windows-x64.zip
      - name: Package Linux distribution
        if: runner.os == 'Linux'
        run: tar -czf opencodex/verification/OpenCodex-Linux-x64.tar.gz -C opencodex/verification OpenCodex-Linux-x64
      - name: Upload verified distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OpenCodex-${{ matrix.label }}-x64
          path: |
            opencodex/verification/OpenCodex-*.zip
            opencodex/verification/OpenCodex-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OpenCodex-${{ matrix.label }}-verification
          path: |
            opencodex/verification/*.json
            opencodex/verification/*.log
            opencodex/verification/*.png
          if-no-files-found: warn
          retention-days: 14
